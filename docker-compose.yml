  services:
        Banco-de-Dados-Postgres:
          image: postgres:16
          environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
            POSTGRES_DB: trilheiros
          ports:
            - "5433:5432"
          volumes:
            - dados_postgres:/var/lib/postgresql/data

  volumes:
        dados_postgres:
